# example.toml: a small CiteMesh user config.
# As config.toml, it makes every `citemesh build` a hybrid build that adds its graph to the dashboard collection in out/.
# It needs the embeddings and viz extras, which citemesh[recommended] installs.
# Copy it to the path that `citemesh config path` prints, which replaces any config already there, then run: citemesh build "arxiv:1706.03762"
# Every other key, with its default, is in config_reference.toml. The `citemesh config` commands are in docs/guides/configuration.md.

[defaults]
# Hybrid ranks the seed's references, citers and Semantic Scholar recommendations with local embeddings, the strategy built for finding related work.
# It downloads the embedding model on first use. Choose "recommendation" instead to skip the embeddings extra and the model download.
strategy = "hybrid"

# The dashboard keeps every seed's graph in one viewer, and each build also saves its graph JSON in out/, so no other format is needed.
export = ["dashboard"]
