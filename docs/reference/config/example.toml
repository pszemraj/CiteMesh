# example.toml: a small CiteMesh user config.
# Makes builds use hybrid discovery and add their graph to the dashboard collection in out/.
# Requires citemesh[recommended]. Setup and config location: docs/guides/configuration.md.
# Copy these values into config.toml, then run: citemesh build "arxiv:1706.03762"
# Every accepted key and its default is in config_reference.toml.

[defaults]
# With the default candidate source, use local embeddings and citation evidence without a corpus index.
strategy = "hybrid"

# Keep results together in an interactive viewer with portable graph data.
export = ["dashboard"]
