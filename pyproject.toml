[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citemesh"
version = "1.0.0"
description = "Connected Papers-style citation graph visualization with multiple similarity strategies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CiteMesh Contributors" }]
keywords = [
    "citation-analysis",
    "graph-visualization",
    "semantic-similarity",
    "bibliometrics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "matplotlib>=3.5.0",
    "networkx>=2.6",
    "numpy>=1.21.0",
    "semanticscholar>=0.8.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "datasets>=2.14.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[project.scripts]
citemesh = "citemesh.cli:main"

[project.urls]
Repository = "https://github.com/yourusername/paper-graph-vis"
Issues = "https://github.com/yourusername/paper-graph-vis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["citemesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]                  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
