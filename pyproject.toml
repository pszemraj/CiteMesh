[build-system]
requires = ["setuptools>=68.0.0", "wheel", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citemesh"
dynamic = ["version"]
description = "Intuitive citation graph visualization with multiple similarity strategies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Peter Szemraj", email = "peterszemeraj+dev@gmail.com" }]
maintainers = [
    { name = "Peter Szemraj", email = "peterszemeraj+dev@gmail.com" },
]
keywords = [
    "citation-graph",
    "graph-visualization",
    "semantic-similarity",
    "bibliometrics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "matplotlib>=3.5.0",
    "networkx>=2.6",
    "numpy>=1.21.0",
    "h5py>=3.9.0",
    "semanticscholar>=0.8.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "datasets>=2.14.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "plotly>=5.18.0",
    "pyvis>=0.3.2",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[project.scripts]
citemesh = "citemesh.cli:main"

[project.urls]
Repository = "https://github.com/pszemraj/citemesh"
Issues = "https://github.com/pszemraj/citemesh/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["citemesh*"]

[tool.setuptools_scm]
write_to = "citemesh/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "dirty-tag"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]                  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
