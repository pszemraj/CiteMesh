[build-system]
requires = ["setuptools>=77.0.0", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citemesh"
dynamic = ["version"]
description = "Turn one paper into an interactive map of the research around it, fusing citations with local embeddings"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Szemraj", email = "peterszemraj+dev@gmail.com" }]
maintainers = [{ name = "Peter Szemraj", email = "peterszemraj+dev@gmail.com" }]
keywords = [
    "arxiv",
    "bibliometrics",
    "citation-graph",
    "citation-network",
    "embeddings",
    "graph-visualization",
    "literature-review",
    "research-tools",
    "semantic-scholar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "filelock>=3.32.4",
    "h5py>=3.10.0",
    "matplotlib>=3.5.0",
    "networkx>=2.6",
    "numpy>=1.21.0",
    "requests>=2.28.0",
    "rich>=13.7.0",
    "rich-argparse>=1.8.0",
    "scikit-learn>=1.3.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
viz = ["plotly>=5.18.0", "pyvis>=0.3.2"]
embeddings = [
    "datasets>=2.14.0",
    "huggingface_hub>=0.24.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.9.0; sys_platform != 'darwin'",
    "torch>=2.13.0; sys_platform == 'darwin'",
    "transformers>=5.2.0",
]
recommended = ["citemesh[embeddings,viz]"]
dev = [
    "citemesh[embeddings]",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]
all = ["citemesh[dev,embeddings,viz]"]

[project.scripts]
citemesh = "citemesh.__main__:run"

[project.urls]
Homepage = "https://github.com/pszemraj/CiteMesh"
Repository = "https://github.com/pszemraj/CiteMesh.git"
Issues = "https://github.com/pszemraj/CiteMesh/issues"
Documentation = "https://github.com/pszemraj/CiteMesh/tree/main/docs"
"Live demo" = "https://pszemraj.github.io/CiteMesh/"
"Release notes" = "https://github.com/pszemraj/CiteMesh/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["citemesh*"]

[tool.setuptools.package-data]
citemesh = ["visualization/dashboard/assets/*"]

[tool.setuptools_scm]
version_file = "src/citemesh/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short -m \"not slow\""
# Dump every thread's stack when a test exceeds this, so a hang self-diagnoses in CI.
faulthandler_timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "cuda: marks tests that require a real CUDA device",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = ["E501"]                  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["citemesh"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
