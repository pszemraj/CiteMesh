name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.9.0"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Explicitly anonymous: tests must never hit authenticated S2 paths.
      S2_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU torch (Linux)
        if: runner.os == 'Linux'
        run: pip install "torch>=2.9" --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev,viz]"
      - name: Run tests
        run: python -m pytest

  smoke-core:
    # Locks in the lazy-import contract: the CLI must work with no extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core package only
        run: pip install .
      - name: CLI help
        run: citemesh --help
      - name: Import and config smoke
        run: |
          python -c "import citemesh; from citemesh import cli"
          citemesh config path
          citemesh cache scan
