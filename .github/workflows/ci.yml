name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede in-flight PR runs, but let every push to main finish so each
  # commit on the release branch has its own verified result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Ruff is a static linter configured entirely by pyproject.toml, so it
      # needs neither the package nor the test matrix. One run covers them all.
      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU torch
        # Installed first from the CPU index so the dev extra does not pull the
        # multi-GB CUDA wheel from PyPI.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev,viz]"

      - name: Test
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Verify wheel package data
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "expected exactly one wheel, found: ${wheels[*]}" >&2
            exit 1
          fi
          unzip -l "${wheels[0]}"
          unzip -l "${wheels[0]}" | grep -q 'citemesh/py.typed'
          unzip -l "${wheels[0]}" | grep -q 'citemesh/visualization/dashboard/assets/dashboard.js'

      - name: Smoke-test the wheel without optional extras
        # The base install carries no torch, plotly, or pyvis. Optional imports
        # are lazy by design, so the CLI must still start and parse arguments.
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/smoke/bin/citemesh" --version
          "$RUNNER_TEMP/smoke/bin/citemesh" --help > /dev/null
          "$RUNNER_TEMP/smoke/bin/citemesh" build --help > /dev/null
          "$RUNNER_TEMP/smoke/bin/citemesh" cache scan > /dev/null
