name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Each main commit needs a completed verification result; PR updates supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Install CPU torch
        # Installed first from the CPU index so the dev extra does not pull the
        # multi-GB CUDA wheel from PyPI.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev,viz]"

      - name: Test
        run: python -m pytest
